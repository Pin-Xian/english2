<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>單字練習本</title>
<meta name="description" content="全民英檢、托福、多益、雅思單字練習：間隔複習、選擇題、聽寫、例句與文法，附發音。">
<meta name="theme-color" content="#2a46c9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="單字練習本">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centered column — mode tabs on top, a large index card in the middle, controls below */
:root{
  --bg:#eef1f6; --paper:#ffffff; --ink:#18213a; --muted:#5d6782; --line:#d6dbe7;
  --accent:#2a46c9; --accent-ink:#ffffff; --mark:#ffe36b; --good:#1d8a55; --bad:#c43a3a;
  --display:"Bricolage Grotesque", "Noto Sans TC", system-ui, sans-serif;
  --body:"Noto Sans TC", system-ui, -apple-system, "PingFang TC", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10131c; --paper:#1a1f2d; --ink:#e7eaf3; --muted:#9aa3bc; --line:#2c3347;
  --accent:#8ea2ff; --accent-ink:#0d1226; --mark:#d9b833; --good:#4fc98a; --bad:#ff7a7a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10131c; --paper:#1a1f2d; --ink:#e7eaf3; --muted:#9aa3bc; --line:#2c3347;
  --accent:#8ea2ff; --accent-ink:#0d1226; --mark:#d9b833; --good:#4fc98a; --bad:#ff7a7a; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:1.9rem;margin:0;letter-spacing:-.02em;line-height:1.1}
h1 span{background:linear-gradient(transparent 58%,var(--mark) 58%);padding:0 .1em}
.stats{font-family:var(--mono);font-size:.78rem;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:500}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px}
nav button{border:0;background:transparent;color:var(--muted);font:500 .92rem var(--body);padding:9px 4px;border-radius:9px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.settings{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted)}
.settings label{display:flex;align-items:center;gap:6px;min-width:0;max-width:100%;white-space:nowrap}
.settings select{min-width:0;max-width:100%}
#level{max-width:calc(100vw - 100px)}
select,input[type=text],input[type=search]{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
input[type=range]{accent-color:var(--accent);width:90px}
input[type=checkbox]{accent-color:var(--accent)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:40px 22px 28px;
  box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(20,30,70,.35);
  background-image:linear-gradient(var(--paper) 52px,transparent 52px),repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);
  min-height:290px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;position:relative}
.card .tag{position:absolute;top:14px;left:18px;font-family:var(--mono);font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.card .lvl{position:absolute;top:12px;right:16px;font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--mark);color:#3a2f00}
.word{font-family:var(--display);font-weight:700;font-size:clamp(2.2rem,9vw,3.4rem);letter-spacing:-.02em;line-height:1.05;word-break:break-word}
.pos{font-family:var(--mono);font-size:.75rem;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 9px}
.meaning{font-size:1.2rem;font-weight:700;max-width:30em}
.speak{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--accent);color:var(--accent-ink);
  font:600 .95rem var(--body);padding:10px 18px;border-radius:99px;cursor:pointer}
.speak.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);padding:6px 12px;font-size:.85rem}
.speak svg{width:18px;height:18px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{min-height:46px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:500 .95rem var(--body);padding:10px 18px;border-radius:10px;cursor:pointer;min-width:96px}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.good{border-color:var(--good);color:var(--good)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.hint{font-size:.88rem;color:var(--muted);text-align:center;max-width:34em}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
@media (max-width:440px){.options{grid-template-columns:1fr}}
.opt{border:1px solid var(--line);background:var(--paper);color:var(--ink);font:500 .95rem var(--body);padding:12px;border-radius:12px;cursor:pointer;text-align:left}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--paper))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--paper))}
.spell{display:flex;gap:8px;width:100%;max-width:360px}
.spell input{flex:1;min-width:0;font:500 1.3rem var(--mono);text-align:center;padding:10px}
.feedback{font-weight:700;min-height:1.6em;margin:0}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}
.progress{height:4px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.list{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .w{font-family:var(--display);font-weight:700;font-size:1.1rem}
.item .w small{font:500 .7rem var(--body);color:var(--muted);margin-left:6px}
.item .m{color:var(--muted);font-size:.86rem;min-width:0}
.score{font-family:var(--mono);font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.icon-btn{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px;display:inline-flex}
.icon-btn:hover{color:var(--accent)}
.icon-btn svg{width:18px;height:18px}
.add{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
@media (max-width:440px){.add{grid-template-columns:1fr}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dot.weak{background:var(--bad)} .dot.ok{background:var(--good)}
.section-title{font-family:var(--display);font-weight:700;font-size:1.1rem;margin:0}
.note{font-size:.8rem;color:var(--muted);margin:0}
.search{width:100%}
/* spaced review */
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.btn.grade{min-width:0;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.3}
.btn.grade small{font:400 .72rem var(--mono);color:var(--muted)}
.stage{font-weight:500;letter-spacing:0;text-transform:none}
.stage.new{color:var(--accent)} .stage.learn{color:var(--bad)} .stage.known{color:var(--good)}
.mem{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.membar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--line)}
.membar i{display:block;height:100%}
.memkey{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.memkey .k{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* sentence practice */
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:500 .85rem var(--body);padding:6px 10px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.card.sent{justify-content:flex-start;padding-top:44px;text-align:left;align-items:stretch;background-image:none}
[hidden]{display:none!important}
.answer .chip:disabled{opacity:1}
.zh{font-size:1rem;color:var(--muted);margin:0}
.en{font-family:var(--display);font-weight:500;font-size:clamp(1.15rem,4.6vw,1.45rem);line-height:1.45;margin:0}
.en mark{background:linear-gradient(transparent 55%,var(--mark) 55%);color:inherit;font-weight:700}
.blank{display:inline-block;min-width:5.5em;border-bottom:2px solid var(--accent);color:var(--accent);text-align:center;font-weight:700}
.answer{min-height:56px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.answer.ok{border-style:solid;border-color:var(--good)} .answer.no{border-style:solid;border-color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 1rem var(--display);padding:7px 11px;border-radius:9px;cursor:pointer;min-height:40px}
.chip:disabled{opacity:.25;cursor:default}
.answer .chip{background:var(--paper);border-color:var(--accent)}
.gnote{border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--paper));border-radius:0 12px 12px 0;padding:12px 14px;display:flex;flex-direction:column;gap:6px;text-align:left}
.gnote h3{margin:0;font-size:.95rem;color:var(--accent)}
.gnote .pat{font-family:var(--mono);font-size:.8rem;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:3px 8px;align-self:flex-start;max-width:100%;overflow-wrap:anywhere}
.gnote p{margin:0;font-size:.92rem}
.gnote details summary{cursor:pointer;color:var(--accent);font-size:.85rem}
.gnote details p{margin-top:6px;color:var(--muted)}
.topic{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.topic h2{font-family:var(--display);font-size:1.15rem;margin:0}
.topic .ex{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;border-top:1px solid var(--line);padding-top:10px}
.topic .ex p{margin:0}
.topic .ex .why{grid-column:2;font-size:.85rem;color:var(--muted)}
.tip{font-size:.85rem;color:var(--muted);margin:0}
.tip b{color:var(--ink)}
.bulk textarea{width:100%;min-height:120px;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1><span>單字</span>練習本</h1>
    <div class="stats"><span id="sLabel">中高級</span><span>單字 <b id="sTotal">0</b></span><span>今日待複習 <b id="sDue">0</b></span><span>已記住 <b id="sKnown">0</b></span></div>
  </header>

  <nav role="tablist">
    <button role="tab" data-mode="cards" aria-selected="true">複習</button>
    <button role="tab" data-mode="quiz" aria-selected="false">選擇題</button>
    <button role="tab" data-mode="dict" aria-selected="false">聽寫</button>
    <button role="tab" data-mode="sent" aria-selected="false">例句</button>
    <button role="tab" data-mode="list" aria-selected="false">單字庫</button>
  </nav>

  <div class="settings" id="sentSettings" hidden>
    <div class="seg" role="group" aria-label="例句練習方式">
      <button data-sub="order" aria-pressed="true">句子重組</button>
      <button data-sub="cloze" aria-pressed="false">克漏字</button>
      <button data-sub="listen" aria-pressed="false">聽句子</button>
      <button data-sub="notes" aria-pressed="false">文法筆記</button>
    </div>
    <label>文法主題 <select id="topic"><option value="all">全部主題</option></select></label>
  </div>

  <div class="settings" id="wordSettings">
    <div class="seg" role="group" aria-label="考試">
      <button data-exam="gept" aria-pressed="true">全民英檢</button>
      <button data-exam="toefl" aria-pressed="false">托福</button>
      <button data-exam="toeic" aria-pressed="false">多益</button>
      <button data-exam="ielts" aria-pressed="false">雅思</button>
      <button data-exam="my" aria-pressed="false">我的單字</button>
    </div>
    <label>範圍 <select id="level"></select></label>
  </div>
  <div class="settings" id="quizSettings" hidden>
    <label><input id="weakOnly" type="checkbox"> 只練待加強</label>
    <label><input id="newFirst" type="checkbox" checked> 優先出沒練過的</label>
  </div>
  <div class="settings">
    <label id="newPerDayWrap">每天新字 <select id="newPerDay"><option>5</option><option>10</option><option selected>20</option><option>30</option><option>50</option></select> 個</label>
    <label id="sizeWrap" hidden>每輪 <select id="size"><option>10</option><option selected>20</option><option>50</option><option>100</option></select> 題</label>
    <label>口音 <select id="accent"><option value="en-US">美式</option><option value="en-GB">英式</option></select></label>
    <label>語速 <input id="rate" type="range" min="0.5" max="1.2" step="0.1" value="0.9"></label>
  </div>

  <div class="progress"><i id="bar" style="width:0%"></i></div>
  <main id="view"></main>
  <p class="note" id="voiceNote"></p>
  <p class="note" id="offlineNote"></p>
  <p class="note" id="sources">單字來源：全民英檢中高級字表（含初級、中級）；托福小黑書（12 單元）；托福分類字彙（33 學科）；多益必考單字 3,000；雅思 5000 字。</p>
</div>

<script src="words.js"></script>
<script src="toefl.js"></script>
<script src="toeic.js"></script>
<script src="ielts.js"></script>
<script src="sentences.js"></script>
<script>
const LV=['初級','中級','中高級'];
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
const DEL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';

const KEY='vocab-notebook-v2';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const k=w=>w.toLowerCase();

/* ---------- data & storage ---------- */
let store={custom:[],prog:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.prog)store=s;}catch(e){}
const builtin=DATA.map(([w,pos,m,lv])=>({w,pos,m,lv:+lv,ex:'gept'}));
const TU=typeof TOEFL_UNITS!=='undefined'?TOEFL_UNITS:{};
const TC=typeof TOEFL_CATS!=='undefined'?TOEFL_CATS:{};
const nums=s=>s?String(s).split('.').map(Number):[];
// 托福：[單字, 中文, 小黑書單元, 出現頻率, 分類字彙學科, 例句英文, 例句中文]
const toefl=(typeof TOEFL!=='undefined'?TOEFL:[]).map(([w,m,u,f,c,xe,xz])=>({w,m,pos:'',u:nums(u),f:f||0,c:nums(c),xe,xz,ex:'toefl'}));
const toeic=(typeof TOEIC!=='undefined'?TOEIC:[]).map(([w,pos,m],n)=>({w,pos,m,n,ex:'toeic'}));
const TG=typeof TOEIC_GROUPS!=='undefined'?TOEIC_GROUPS:[];
const ielts=(typeof IELTS!=='undefined'?IELTS:[]).map(([w,pos,m],n)=>({w,pos,m,n,ex:'ielts'}));
const IG=typeof IELTS_GROUPS!=='undefined'?IELTS_GROUPS:[];
const builtinSet=new Set([...builtin,...toefl,...toeic,...ielts].map(x=>k(x.w)));
// carry over words and progress from the first version of this app
try{const old=JSON.parse(localStorage.getItem('vocab-notebook-v1')||'null');
  if(old&&old.words&&!store.migrated){
    old.words.forEach(o=>{if(o.c||o.x)store.prog[k(o.w)]=[o.c|0,o.x|0];
      if(!builtinSet.has(k(o.w))&&!store.custom.some(c=>k(c.w)===k(o.w)))store.custom.push({w:o.w,m:o.m,pos:o.pos||''})});
    store.migrated=true;}}catch(e){}
let ALL=[];
function rebuild(){ALL=[...store.custom.map(c=>({...c,lv:'my',ex:'my'})),...builtin,...toefl,...toeic,...ielts]}
rebuild();
if(!store.sprog)store.sprog={};
if(!store.srs)store.srs={};
// 例句資料（sentences.js）；沒有載入時例句功能會自動隱藏
const GR=typeof GRAMMAR!=='undefined'?GRAMMAR:[];
const SS=typeof SENTS!=='undefined'?SENTS:[];
const GMAP=Object.fromEntries(GR.map(g=>[g.id,g]));
const SENT_BY_WORD={};SS.forEach(s=>{(SENT_BY_WORD[k(s.w)]=SENT_BY_WORD[k(s.w)]||[]).push(s)});
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}renderStats()}
const P=w=>store.prog[k(w.w)]||[0,0];
const S=w=>store.srs[k(w.w)];
const isWeak=w=>{const[c,x]=P(w);const s=S(w);return (x>0&&x>=c)||(!!s&&s.l>0&&s.i<7)};
const isKnown=w=>{const s=S(w);return !!s&&s.i>=21};
const isNew=w=>{const[c,x]=P(w);return c+x===0&&!S(w)};

/* ---------- 間隔複習排程 ---------- */
// 每個字的狀態：i=間隔天數(0=學習中), e=難易係數, d=下次複習時間, r=複習次數, l=忘記次數, st=學習步驟
const DAY=864e5;
const dayStart=(t=Date.now())=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const todayStr=()=>new Date().toLocaleDateString('sv');
function today(){if(!store.today||store.today.date!==todayStr())store.today={date:todayStr(),nw:{},words:[]};if(typeof store.today.nw!=='object')store.today.nw={};return store.today}
const isDue=w=>{const s=S(w);return !!s&&s.d<dayStart()+DAY};
function fmtI(i){return i<=0?'這輪再看':i===1?'明天':i<30?i+' 天後':i<365?Math.round(i/30)+' 個月後':Math.round(i/365*10)/10+' 年後'}
// g: 0忘了 1模糊 2記得 3很熟；回傳新狀態與「這輪幾張後再出現」(0 表示今天不再出現)
function plan(w,g){
  const old=S(w);const s=old?{...old}:{i:0,e:2.5,r:0,l:0,st:0};
  let again=0;
  if(s.i===0){            // 新字或學習中
    if(g===0){s.st=0;again=3}
    else if(g===1){again=5}
    else if(g===2){if(s.st<1){s.st=1;again=8}else s.i=1}
    else{s.i=old?2:4;s.e+=.15}
  }else{                  // 已進入長期複習
    if(g===0){s.l++;s.e=Math.max(1.3,s.e-.2);s.i=0;s.st=0;again=3}
    else if(g===1){s.e=Math.max(1.3,s.e-.15);s.i=Math.max(1,Math.round(s.i*1.2))}
    else if(g===2){s.i=Math.max(s.i+1,Math.round(s.i*s.e))}
    else{s.i=Math.max(s.i+2,Math.round(s.i*s.e*1.3));s.e+=.15}
  }
  if(again){s.d=Date.now()}else{s.st=0;s.r++;s.d=dayStart()+s.i*DAY}
  return {s,again,label:again?'這輪再看':fmtI(s.i)};
}
function grade(w,g){
  const t=today();const key=k(w.w);
  if(!S(w))t.nw[w.ex]=(t.nw[w.ex]||0)+1;
  if(!t.words.includes(key))t.words.push(key);
  const p=plan(w,g);store.srs[key]=p.s;
  const pr=P(w).slice();g>=2?pr[0]++:pr[1]++;store.prog[key]=pr;
  save();return p;
}
// 選擇題、聽寫的結果也會影響排程：答錯就排回今天複習
function mark(w,ok){
  const p=P(w).slice();ok?p[0]++:p[1]++;store.prog[k(w.w)]=p;
  const s=S(w);
  if(!ok){
    if(!s||s.i>0)store.srs[k(w.w)]={...(s||{e:2.5,r:0,l:0}),i:0,st:0,l:(s?s.l+1:0),d:Date.now()};
  }else if(s&&s.i>0&&isDue(w)){store.srs[k(w.w)]=plan(w,2).s}
  save();
}

/* ---------- 考試與範圍 ---------- */
const exam=()=>document.querySelector('[data-exam][aria-pressed="true"]').dataset.exam;
const LEVELS={
  gept:[['2','中高級'],['1','中級'],['0','初級'],['all','全部級數']],
  toefl:[['all','全部'],['hi','高頻字（小黑書出現 10 次以上）'],
    {g:'托福小黑書（12 單元）',items:[['b1','小黑書全部'],...Object.entries(TU).map(([n,name])=>['u'+n,'Unit '+n+' '+name.split(' ')[0]])]},
    {g:'托福分類字彙（33 學科）',items:[['b2','分類字彙全部'],...Object.entries(TC).map(([n,name])=>['c'+n,n+'. '+name.split(' ').pop()+'（'+name.split(' ').slice(0,-1).join(' ')+'）'])]}],
  toeic:[['all','全部'],...TG.map(([a,b,w1,w2],i)=>['g'+i,`第 ${a+1}–${b} 字（${w1} – ${w2}）`])],
  ielts:[['all','全部'],...IG.map(([a,b,l1,l2],i)=>['g'+i,(l1===l2?l1:l1+'–'+l2)+` 開頭（${b-a} 字）`])],
  my:[['all','全部']]
};
function fillLevels(keep){
  const opt=([v,t])=>`<option value="${v}">${esc(t)}</option>`;
  const sel=$('#level');sel.innerHTML=LEVELS[exam()].map(o=>o.g?`<optgroup label="${esc(o.g)}">${o.items.map(opt).join('')}</optgroup>`:opt(o)).join('');
  if(keep&&[...sel.options].some(o=>o.value===keep))sel.value=keep;
}
function inLevel(w){
  const ex=exam();if(w.ex!==ex)return false;
  const l=$('#level').value;if(l==='all')return true;
  if(ex==='gept')return w.lv===+l;
  if(ex==='toefl'){
    if(l==='hi')return w.f>=10;if(l==='b1')return w.u.length>0;if(l==='b2')return w.c.length>0;
    const n=+l.slice(1);return l[0]==='u'?w.u.includes(n):w.c.includes(n);
  }
  if(ex==='toeic'||ex==='ielts'){const g=(ex==='toeic'?TG:IG)[+l.slice(1)];return !!g&&w.n>=g[0]&&w.n<g[1]}
  return true;
}
function levelWords(){return ALL.filter(inLevel)}
function scopeName(){const l=$('#level');const ex={gept:'英檢',toefl:'托福',toeic:'多益',ielts:'雅思',my:'我的單字'}[exam()];
  return exam()==='my'?ex:ex+' · '+(l.options[l.selectedIndex]?.text||'').replace(/（.*）/,'')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pool(){
  let ws=levelWords();
  if($('#weakOnly').checked)ws=ws.filter(isWeak);
  const n=+$('#size').value;
  if($('#newFirst').checked&&!$('#weakOnly').checked){
    const fresh=shuffle(ws.filter(isNew)),weak=shuffle(ws.filter(isWeak)),rest=shuffle(ws.filter(w=>!isNew(w)&&!isWeak(w)));
    // mix in a few weak words so they keep coming back
    const nw=Math.min(weak.length,Math.ceil(n*.3));
    return shuffle([...weak.slice(0,nw),...fresh,...rest].slice(0,n));
  }
  return shuffle(ws).slice(0,n);
}
const lvTag=w=>w.ex==='my'?'我的':w.ex==='toeic'?'多益':w.ex==='ielts'?'雅思':w.ex==='toefl'?'托福 '+(w.u.length&&!(w.c.length&&/^(c|b2)/.test($('#level').value))?(TU[w.u[0]]||'').split(' ')[0]:(TC[w.c[0]]||'').split(' ').pop()):'英檢'+LV[w.lv];

let mode='cards',queue=[],idx=0,flipped=false,answered=false,round={right:0,total:0},q='';

function start(){queue=mode==='sent'?sentPool():mode==='cards'?srsPool():pool();idx=0;flipped=false;answered=false;round={right:0,total:0,g:[0,0,0,0]};render()}
function newLeft(){return Math.max(0,+$('#newPerDay').value-(today().nw[exam()]||0))}
function srsPool(extraNew){
  if(cram){const set=new Set(today().words);return shuffle(ALL.filter(w=>set.has(k(w.w))&&w.ex===exam()).filter((w,i,a)=>a.findIndex(x=>k(x.w)===k(w.w))===i))}
  const ws=levelWords();
  const due=ws.filter(isDue).sort((a,b)=>S(a).d-S(b).d).slice(0,150);
  let fresh=ws.filter(w=>!S(w));
  fresh=exam()==='toefl'?fresh:shuffle(fresh);   // 托福依書中順序：小黑書高頻字在前
  fresh=fresh.slice(0,extraNew||newLeft());
  // 每 3 張複習卡插入 1 張新字
  const q=[];let a=0,b=0;
  while(a<due.length||b<fresh.length){
    for(let n=0;n<3&&a<due.length;n++)q.push(due[a++]);
    if(b<fresh.length)q.push(fresh[b++]);
  }
  return q;
}

function distractors(w){
  const near=o=>o.ex===w.ex&&(w.ex==='gept'?o.lv===w.lv:w.ex==='toefl'?(o.u.some(x=>w.u.includes(x))||o.c.some(x=>w.c.includes(x))):true);
  let src=ALL.filter(o=>o!==w&&k(o.w)!==k(w.w)&&o.m!==w.m&&near(o));
  if(src.length<3)src=ALL.filter(o=>o!==w&&k(o.w)!==k(w.w)&&o.m!==w.m&&o.ex===w.ex);
  if(src.length<3)src=ALL.filter(o=>o!==w&&k(o.w)!==k(w.w)&&o.m!==w.m);
  const pos0=w.pos.split('/')[0];
  const same=shuffle(src.filter(o=>o.pos.split('/')[0]===pos0)).slice(0,3);
  return same.length===3?same:[...same,...shuffle(src.filter(o=>!same.includes(o)))].slice(0,3);
}

const GRADES=[['忘了','bad'],['模糊',''],['記得','good'],['很熟','']];
function stageOf(w){const s=S(w);if(!s)return['新字','new'];if(s.i===0)return[s.l?'重新學習':'學習中','learn'];if(s.i>=21)return['已記住','known'];return['複習','rev']}
function memoryBar(){

}

let sub='order',orderState=null;

function wordExample(w){
  const list=SENT_BY_WORD[k(w.w)];

function renderSent(){
  const v=$('#view');
  if(!SS.length){v.innerHTML='<section class="card"><p class="hint">找不到例句資料（sentences.js）。</p></section>';return}
  if(sub==='notes')return renderNotes();
  if(!queue.length){v.innerHTML='<section class="card"><p class="hint">這個主題目前沒有例句。</p></section>';return}
  if(idx>=queue.length){
    v.innerHTML=doneView('這一輪的例句練完了。答錯的句子下一輪會優先出現。');
    $('#again').onclick=start;return;
  }
  const s=queue[idx];
  const nextBtn=`<div class="row" style="margin-top:14px"><button class="btn primary" id="nx" hidden>下一句 →</button></div>`;

  if(sub==='order'){
    if(!orderState||orderState.s!==s){
      const toks=s.en.split(' ');
      let order=shuffle(toks.map((t,i)=>i));
      if(toks.length>2)while(order.every((x,i)=>x===i))order=shuffle(order);
      orderState={s,toks,order,picked:[]};
    }
    const{toks,order,picked}=orderState;
    v.innerHTML=`<section class="card sent">${sentHead(s,'句子重組')}
      <p class="zh">${esc(s.zh)}</p>
      <div class="answer" id="ans">${picked.length?picked.map((ti,pi)=>`<button class="chip" data-back="${pi}">${esc(toks[ti])}</button>`).join(''):'<span class="hint" style="align-self:center">依序點選下面的字，排出正確的英文句子</span>'}</div>
      <div class="bank">${order.map(ti=>`<button class="chip" data-take="${ti}" ${picked.includes(ti)?'disabled':''}>${esc(toks[ti])}</button>`).join('')}</div>
      <div class="row"><button class="btn" id="undo" ${picked.length?'':'disabled'}>清除重來</button><button class="btn" id="giveup">直接看答案</button></div>
      <div id="res"></div></section>${nextBtn}`;
    const finish=(given)=>{
      answered=true;
      const ok=!given&&picked.map(i=>toks[i]).join(' ')===s.en;
      round.total++;if(ok)round.right++;smark(s,ok);
      $('#ans').classList.add(ok?'ok':'no');
      v.querySelectorAll('.chip,#undo,#giveup').forEach(b=>b.disabled=true);
      $('#res').innerHTML=sentResult(s,ok,'排對了！');
      speak(s.en);
      $('#nx').hidden=false;$('#nx').focus();
    };
    v.querySelectorAll('[data-take]').forEach(b=>b.onclick=()=>{if(answered)return;picked.push(+b.dataset.take);
      if(picked.length===toks.length){renderSent();finish(false)}else renderSent()});
    v.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{if(answered)return;picked.splice(+b.dataset.back,1);renderSent()});
    $('#undo').onclick=()=>{orderState.picked=[];renderSent()};
    $('#giveup').onclick=()=>{if(!answered)finish(true)};
    if(answered){ // 重新繪製後保持結果
      const ok=picked.map(i=>toks[i]).join(' ')===s.en;
      $('#ans').classList.add(ok?'ok':'no');v.querySelectorAll('.chip,#undo,#giveup').forEach(b=>b.disabled=true);
      $('#res').innerHTML=sentResult(s,ok,'排對了！');$('#nx').hidden=false;
    }
    $('#nx').onclick=()=>{orderState=null;next()};
  }

  else if(sub==='cloze'){
    const shape=f=>/ing$/.test(f)?'ing':/ed$/.test(f)?'ed':/s$/.test(f)?'s':'';
    const others=shuffle(SS.filter(o=>o.f.toLowerCase()!==s.f.toLowerCase()&&k(o.w)!==k(s.w)));
    const same=others.filter(o=>shape(o.f)===shape(s.f)&&/^[A-Z]/.test(o.f)===/^[A-Z]/.test(s.f));
    const picks=[...new Set([...same,...others].map(o=>o.f))].slice(0,3);
    const opts=shuffle([s.f,...picks]);
    const i=s.en.indexOf(s.f);
    const blanked=esc(s.en.slice(0,i))+'<span class="blank">?</span>'+esc(s.en.slice(i+s.f.length));
    v.innerHTML=`<section class="card sent">${sentHead(s,'克漏字')}
      <p class="en">${blanked}</p><p class="zh">${esc(s.zh)}</p>
      <div class="options">${opts.map((o,j)=>`<button class="opt" data-i="${j}">${j+1}. ${esc(o)}</button>`).join('')}</div>
      <div id="res"></div></section>${nextBtn}`;
    v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(answered)return;answered=true;
      const ok=opts[+b.dataset.i]===s.f;
      v.querySelectorAll('.opt').forEach((x,j)=>{if(opts[j]===s.f)x.classList.add('right')});
      if(!ok)b.classList.add('wrong');
      round.total++;if(ok)round.right++;smark(s,ok);
      $('#res').innerHTML=sentResult(s,ok,'答對了！');speak(s.en);
      $('#nx').hidden=false;$('#nx').focus();
    });
    $('#nx').onclick=next;
  }

  else if(sub==='listen'){
    v.innerHTML=`<section class="card sent">${sentHead(s,'聽句子')}
      <div class="row"><button class="speak" data-say="${esc(s.en)}">${SPK}播放句子</button></div>
      <p class="hint" style="align-self:center">試著聽懂整句，或跟著唸一遍，再看答案</p>
      <div id="res">${answered?'':`<div class="row"><button class="btn primary" id="show">顯示句子</button></div>`}</div>
      </section><div class="row" style="margin-top:14px" id="rate2" hidden>
        <button class="btn bad" id="no">沒聽懂</button><button class="btn good" id="yes">聽懂了</button></div>`;
    speak(s.en);
    $('#show').onclick=()=>{answered=true;
      $('#res').innerHTML=`<p class="en">${highlight(s)}</p><p class="zh">${esc(s.zh)}</p>
        <div class="row" style="justify-content:flex-start"><button class="speak ghost" data-say="${esc(s.en)}">${SPK}再聽一次</button></div>${gnote(s,false)}`;
      $('#rate2').hidden=false;};
    const done=ok=>{round.total++;if(ok)round.right++;smark(s,ok);next()};
    $('#no').onclick=()=>done(false);$('#yes').onclick=()=>done(true);
  }
}
function renderNotes(){
  $('#bar').style.width='0%';
  const t=$('#topic').value;
  const gs=GR.filter(g=>t==='all'||g.id===t);
  $('#view').innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">${gs.map(g=>`
    <section class="topic"><h2>${esc(g.name)}</h2>
      <span class="pat" style="font-family:var(--mono);font-size:.82rem">${esc(g.pattern)}</span>
      <p style="margin:0">${esc(g.rule)}</p>
      <p class="tip"><b>小提醒：</b>${esc(g.tip)}</p>
      ${SS.filter(s=>s.g===g.id).map(s=>`<div class="ex">
        <button class="icon-btn" data-say="${esc(s.en)}" aria-label="念這一句">${SPK}</button>
        <div><p>${highlight(s)}</p><p class="zh" style="font-size:.88rem">${esc(s.zh)}</p></div>
        <p class="why">${esc(s.note)}</p></div>`).join('')}
    </section>`).join('')}</div>`;
}

function renderList(){
  const v=$('#view');
  v.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">
    <h2 class="section-title">新增我的單字</h2>
    <form class="add" id="af" autocomplete="off">
      <input type="text" id="aw" placeholder="英文，例如 resilient" required>
      <input type="text" id="am" placeholder="中文意思，例如 有韌性的" required>
      <button class="btn primary">加入</button>
    </form>
    <p class="feedback" id="lfb"></p>
    <details class="bulk"><summary class="section-title" style="cursor:pointer">一次新增很多單字</summary>
      <p class="note" style="margin:8px 0">每行一個單字，英文和中文之間用逗號、Tab 或空格隔開。可以直接從 Excel 或 Google 試算表複製兩欄貼上。</p>
      <textarea id="bulk" placeholder="resilient, 有韌性的&#10;meticulous, 一絲不苟的&#10;ubiquitous 無所不在的"></textarea>
      <div class="row" style="justify-content:flex-start;margin-top:8px"><button class="btn primary" id="bulkAdd">全部加入</button></div>
      <p class="feedback" id="bfb"></p>
    </details>
    <h2 class="section-title">查詢單字</h2>
    <input type="search" class="search" id="q" placeholder="輸入英文或中文搜尋目前範圍" value="${esc(q)}">
    <div id="results"></div>
    <h2 class="section-title">備份與換手機</h2>
    <p class="note">學習紀錄存在這台裝置的瀏覽器裡。換手機或清除瀏覽器資料前，先匯出備份檔，再到新裝置匯入。</p>
    <div class="row" style="justify-content:flex-start">
      <button class="btn" id="exp">匯出備份</button>
      <label class="btn" for="imp" style="display:inline-flex;align-items:center;justify-content:center">匯入備份</label>
      <input type="file" id="imp" accept=".json,application/json" hidden>
    </div>
    <p class="feedback" id="xfb"></p>
    <div class="row"><button class="btn" id="reset">重設全部學習紀錄</button></div></div>`;
  $('#bulkAdd').onclick=()=>{
    const have=new Set(ALL.map(x=>k(x.w)));let added=0,dup=0,bad=0;
    $('#bulk').value.split(/\r?\n/).forEach(line=>{
      line=line.trim();if(!line)return;
      let w,m;
      const t=line.split(/\t|,|，/);
      if(t.length>=2){w=t[0];m=t.slice(1).join('，')}
      else{const i=line.search(/[㐀-鿿]/);if(i>0){w=line.slice(0,i);m=line.slice(i)}}
      w=(w||'').trim();m=(m||'').trim();
      if(!w||!m||!/[A-Za-z]/.test(w)){bad++;return}
      if(have.has(k(w))){dup++;return}
      have.add(k(w));store.custom.push({w,m,pos:''});added++;
    });
    rebuild();save();
    const fb=$('#bfb');fb.className='feedback '+(added?'ok':'no');
    fb.textContent=`加入 ${added} 個`+(dup?`，${dup} 個已經在單字庫裡`:'')+(bad?`，${bad} 行看不懂格式（需要英文 + 中文）`:'')+(added?'。選「我的單字」就能練習。':'。');
    if(added)$('#bulk').value='';
    drawResults();
  };
  $('#exp').onclick=()=>{
    const data=JSON.stringify({app:'vocab-notebook',version:2,exported:new Date().toISOString(),store},null,1);
    try{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
      a.download='單字練習本備份-'+new Date().toISOString().slice(0,10)+'.json';
      document.body.appendChild(a);a.click();a.remove();
      $('#xfb').className='feedback ok';$('#xfb').textContent='已下載備份檔。';
    }catch(e){$('#xfb').className='feedback no';$('#xfb').textContent='無法下載備份檔：'+e.message}
  };
  $('#imp').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);const s=d.store||d;
        if(!s||typeof s.prog!=='object')throw new Error('這不是單字練習本的備份檔');
        // 合併：自訂單字取聯集，練習次數取較大值
        const have=new Set(store.custom.map(c=>k(c.w)));
        (s.custom||[]).forEach(c=>{if(c&&c.w&&!have.has(k(c.w))&&!builtinSet.has(k(c.w))){store.custom.push(c);have.add(k(c.w))}});
        for(const key of ['prog','sprog'])Object.entries(s[key]||{}).forEach(([w,p])=>{
          const cur=store[key][w]||[0,0];store[key][w]=[Math.max(cur[0],p[0]|0),Math.max(cur[1],p[1]|0)]});
        // 複習排程：保留複習次數比較多的那一份
        Object.entries(s.srs||{}).forEach(([w,x])=>{const cur=store.srs[w];if(x&&typeof x.d==='number'&&(!cur||(x.r|0)>(cur.r|0)))store.srs[w]=x});
        rebuild();save();renderList();
        $('#xfb').className='feedback ok';$('#xfb').textContent='已匯入並合併備份。';
      }catch(err){$('#xfb').className='feedback no';$('#xfb').textContent='匯入失敗：'+err.message}
    };
    r.readAsText(f);
  };
  const drawResults=()=>{
    const term=q.trim().toLowerCase();
    let ws=levelWords();
    if($('#weakOnly').checked)ws=ws.filter(isWeak);
    if(term)ws=ws.filter(w=>w.w.toLowerCase().includes(term)||w.m.includes(term));
    if(term)ws.sort((a,b)=>(b.w.toLowerCase().startsWith(term))-(a.w.toLowerCase().startsWith(term)));
    const shown=ws.slice(0,120);
    $('#results').innerHTML=`<p class="note" style="margin-bottom:8px">共 ${ws.length.toLocaleString()} 筆${ws.length>shown.length?`，顯示前 ${shown.length} 筆，用搜尋找特定單字`:''}。紅點＝待加強，綠點＝已記住，右邊是下次複習的時間。</p>
    ${shown.length?`<div class="list">${shown.map(w=>{const s=S(w);const due=!s?'—':s.d<dayStart()+DAY?'今天':fmtI(Math.round((s.d-dayStart())/DAY));return `<div class="item">
      <span class="dot ${isWeak(w)?'weak':isKnown(w)?'ok':''}"></span>
      <div style="min-width:0"><div class="w">${esc(w.w)}<small>${lvTag(w)}${w.ex==='toefl'&&w.f?' · 出現 '+w.f+' 次':''}</small></div><div class="m">${esc(w.pos)} ${esc(w.m)}</div></div>
      <span class="score">${due}</span>
      <span><button class="icon-btn" data-say="${esc(w.w)}" aria-label="念 ${esc(w.w)}">${SPK}</button>${w.ex==='my'?`<button class="icon-btn" data-del="${esc(w.w)}" aria-label="刪除 ${esc(w.w)}">${DEL}</button>`:''}</span>
    </div>`}).join('')}</div>`:''}`;
    $('#results').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
      store.custom=store.custom.filter(c=>c.w!==b.dataset.del);rebuild();save();drawResults()});
  };
  drawResults();
  $('#q').oninput=e=>{q=e.target.value;drawResults()};
  $('#af').onsubmit=e=>{e.preventDefault();const w=$('#aw').value.trim(),m=$('#am').value.trim();if(!w||!m)return;
    const fb=$('#lfb');
    if(ALL.some(x=>k(x.w)===k(w))){fb.className='feedback no';fb.textContent=`「${w}」已經在單字庫裡了。`;return}
    store.custom.unshift({w,m,pos:''});rebuild();save();
    fb.className='feedback ok';fb.textContent=`已加入「${w}」，選「我的單字」就能練習。`;
    $('#aw').value='';$('#am').value='';speak(w);drawResults()};
  let armed=false;
  $('#reset').onclick=()=>{if(!armed){armed=true;$('#reset').textContent='再按一次確認重設';return}
    store.prog={};store.sprog={};store.srs={};store.today=null;save();renderList()};
}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));
  mode=b.dataset.mode;orderState=null;cram=false;syncSettings();start()});
function syncSettings(){
  $('#sentSettings').hidden=mode!=='sent';$('#wordSettings').hidden=mode==='sent';
  $('#quizSettings').hidden=!(mode==='quiz'||mode==='dict'||mode==='list');
  $('#newPerDayWrap').hidden=mode!=='cards';
  $('#sizeWrap').hidden=!(mode==='quiz'||mode==='dict'||mode==='sent');
  $('#newFirst').parentElement.hidden=mode==='list';
}
document.querySelectorAll('[data-exam]').forEach(b=>b.onclick=()=>{
  setExam(b.dataset.exam);fillLevels();cram=false;savePrefs();renderStats();start()});
GR.forEach(g=>{const o=document.createElement('option');o.value=g.id;o.textContent=g.name;$('#topic').appendChild(o)});
if(!SS.length)document.querySelector('[data-mode="sent"]').hidden=true;
$('#topic').onchange=()=>{orderState=null;start()};
document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-sub]').forEach(x=>x.setAttribute('aria-pressed',x===b));
  sub=b.dataset.sub;orderState=null;start()});
['level','size','weakOnly','newFirst','newPerDay'].forEach(id=>$('#'+id).addEventListener('change',()=>{cram=false;savePrefs();renderStats();start()}));
['accent','rate'].forEach(id=>$('#'+id).addEventListener('change',savePrefs));

document.addEventListener('keydown',e=>{
  if(e.target.matches('input,select,textarea'))return;
  if(mode==='cards'&&e.key===' '){e.preventDefault();if(!flipped&&idx<queue.length){flipped=true;render()}else if(cram)$('#cnext')?.click()}
  if(mode==='cards'&&flipped&&!cram&&/^[1-4]$/.test(e.key)){document.querySelector(`[data-g="${+e.key-1}"]`)?.click()}
  if((mode==='quiz'||(mode==='sent'&&sub==='cloze'))&&!answered&&/^[1-4]$/.test(e.key)){document.querySelectorAll('.opt')[+e.key-1]?.click()}
});

syncSettings();save();start();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(()=>{
    $('#offlineNote').textContent='已可離線使用：開過一次後，沒有網路也能練習。學習紀錄存在這台裝置上。';
  }).catch(()=>{});
}
</script>
